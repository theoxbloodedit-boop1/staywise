name: Verify application
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # No deployment credentials or database secrets are provided to this job.
      - run: npm run verify
      # Browser fixtures intercept APIs locally; no customer accounts or DB credentials.
      - run: npm run test:browser
